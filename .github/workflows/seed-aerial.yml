name: Pre-load close-up aerial photos

# Requests close-up photo tiles along popular trails through tiles.ridgetrove.com so they're stored and
# instant for hikers. Runs every 6 hours until the list is done (then each run finishes in seconds).
on:
  workflow_dispatch:
    inputs:
      top:
        description: "How many of the most popular SoCal trails to cover"
        default: "500"
  schedule:
    - cron: '23 */6 * * *'

concurrency: seed-aerial

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Get progress and trail data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin seed-state && git show origin/seed-state:state.json > state.json || echo "starting fresh"
          gh release download packs -p socal.db.gz && gunzip socal.db.gz
      - name: Seed (saving progress every half hour)
        run: |
          git config --global user.name build-bot; git config --global user.email build-bot@users.noreply.github.com
          save() {
            rm -rf out && mkdir out && cp state.json out/ && cd out && git init -q -b seed-state && git add -A && git commit -q -m progress \
              && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" seed-state; cd ..
          }
          for i in $(seq 1 11); do
            python3 seeding/seed_aerial.py --top "${{ github.event.inputs.top || '500' }}" --state state.json --max-seconds 1750
            save
            python3 -c "import json,sys;s=json.load(open('state.json'));sys.exit(0 if s['next']<s['total'] or s['retry'] else 1)" || break
          done
