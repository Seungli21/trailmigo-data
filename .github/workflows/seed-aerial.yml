name: Pre-load close-up aerial photos

# Requests close-up photo tiles along popular trails through tiles.ridgetrove.com so they're stored and
# instant for hikers. Runs every 6 hours until the list is done (then each run finishes in seconds).
on:
  workflow_dispatch:
    inputs:
      top:
        description: "How many of the most popular SoCal trails to cover"
        default: "500"
  schedule:
    - cron: '23 */6 * * *'

concurrency: seed-aerial

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Get progress and trail data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin seed-state && git show origin/seed-state:state.json > state.json || echo "starting fresh"
          gh release download packs -p socal.db.gz && gunzip socal.db.gz
      - name: Seed
        run: python3 seeding/seed_aerial.py --top "${{ github.event.inputs.top || '500' }}" --state state.json --max-seconds 19500
      - name: Save progress
        if: always()
        run: |
          mkdir out && cp state.json out/ 2>/dev/null || exit 0
          cd out && git init -q -b seed-state && git config user.name build-bot && git config user.email build-bot@users.noreply.github.com
          git add -A && git commit -q -m "progress" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" seed-state
